<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Vaibhav Chauhan GitHub profile dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/><stop offset=".5" stop-color="#101827"/><stop offset="1" stop-color="#07131A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="ambient1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="ambient2"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".14"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-opacity=".045"/>
    </pattern>
    <pattern id="portraitDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#67E8F9" opacity=".72"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="portraitClip"><rect x="70" y="137" width="400" height="388" rx="12"/></clipPath>
    <clipPath id="frameClip"><rect x="18" y="18" width="1144" height="574" rx="28"/></clipPath>
  </defs>

  <rect width="1180" height="610" fill="#F8FAFC"/>
  <rect x="18" y="18" width="1144" height="574" rx="28" fill="#F8FBFD" stroke="#7DD3FC" stroke-width="1.5"/>
  <g clip-path="url(#frameClip)">
    <rect x="18" y="18" width="1144" height="574" fill="url(#microgrid)"/>
    <circle cx="210" cy="150" r="250" fill="url(#ambient1)">
      <animate attributeName="cx" values="210;250;210" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="500" r="300" fill="url(#ambient2)">
      <animate attributeName="cy" values="500;455;500" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- browser/terminal header -->
