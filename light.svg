    <text x="932" y="72" fill="#64748B" font-family="ui-monospace,monospace" font-size="12">▣ Projects</text>
    <text x="1025" y="72" fill="#64748B" font-family="ui-monospace,monospace" font-size="12">▤ Experience</text>
    <text x="1100" y="72" text-anchor="end" fill="#67E8F9" font-family="ui-monospace,monospace" font-size="12">∞ Contact</text>

