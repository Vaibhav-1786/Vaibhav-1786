    <rect x="516" y="108" width="624" height="454" rx="20" fill="#FFFFFF" fill-opacity=".90" stroke="#7DD3FC" stroke-opacity=".75" filter="url(#shadow)"/>

    <text x="66" y="137" fill="#67E8F9" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">VISUAL.MAP</text>
    <line x1="66" y1="149" x2="468" y2="149" stroke="#CBD5E1"/>

    <!-- sample-inspired digital portrait: generic silhouette, not a real person's face -->
