    <circle cx="65" cy="66" r="7" fill="#F87171"/><circle cx="88" cy="66" r="7" fill="#FBBF24"/><circle cx="111" cy="66" r="7" fill="#34D399"/>
    <text x="137" y="72" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="14">vaibhav/README.md</text>
