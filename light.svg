      <path d="M192 263 C198 213 229 190 270 190 C311 190 342 213 348 263"
            fill="none" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round" opacity=".75"/>
      <rect x="211" y="270" width="48" height="30" rx="10" fill="none" stroke="#67E8F9" stroke-width="2"/>
      <rect x="281" y="270" width="48" height="30" rx="10" fill="none" stroke="#67E8F9" stroke-width="2"/>
      <path d="M259 284H281" stroke="#67E8F9" stroke-width="2"/>
      <path d="M224 344 Q270 370 316 344" fill="none" stroke="#8B5CF6" stroke-width="2" opacity=".7"/>
