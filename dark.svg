      <text x="536" y="483" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">REAL ESTATE PROJECT</text>
      <text x="536" y="503" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">github.com/Vaibhav-1786/Real_Estate-Project</text>
