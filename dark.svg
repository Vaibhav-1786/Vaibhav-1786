    <line x1="500" y1="536" x2="1104" y2="536" stroke="#334155" stroke-opacity=".7"/>
    <text x="500" y="551" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">STATUS</text>
    <text x="555" y="551" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">READY</text>
    <text x="1068" y="551" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">github.com/Vaibhav-1786</text>

    <rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".34">
