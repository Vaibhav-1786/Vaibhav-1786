<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Vaibhav Chauhan professional GitHub profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".52" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset=".52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033" stop-opacity=".72"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity=".38"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="18" y="18" width="1144" height="574" rx="24"/></clipPath>
  </defs>

  <rect width="1180" height="610" fill="#020617"/>
  <rect x="18" y="18" width="1144" height="574" rx="24" fill="url(#bg)" stroke="#334155" stroke-opacity=".75"/>
  <g clip-path="url(#frame)">
    <rect x="18" y="18" width="1144" height="574" fill="url(#grid)"/>
    <circle cx="160" cy="130" r="270" fill="url(#glow1)">
      <animate attributeName="cx" values="160;210;160" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="500" r="310" fill="url(#glow2)">
